<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2c72"/>
      <stop offset="55%" stop-color="#1d1545"/>
      <stop offset="100%" stop-color="#0b0a18"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5a2e"/>
      <stop offset="50%" stop-color="#5e3a1e"/>
      <stop offset="100%" stop-color="#38200e"/>
    </linearGradient>
    <filter id="runeGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <polygon id="spike" points="64,4 69,16 59,16"/>
    <polygon id="spikeLong" points="64,0 68.5,17 59.5,17"/>
  </defs>

  <!-- branch spikes around the rim -->
  <g fill="#4a2c14">
    <use href="#spikeLong" transform="rotate(12 64 64)"/>
    <use href="#spike" transform="rotate(48 64 64)"/>
    <use href="#spike" transform="rotate(96 64 64)"/>
    <use href="#spikeLong" transform="rotate(138 64 64)"/>
    <use href="#spike" transform="rotate(184 64 64)"/>
    <use href="#spike" transform="rotate(228 64 64)"/>
    <use href="#spikeLong" transform="rotate(274 64 64)"/>
    <use href="#spike" transform="rotate(318 64 64)"/>
  </g>

  <!-- wooden ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#wood)" stroke-width="15"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#241305" stroke-width="15"
          stroke-dasharray="7 11 3 9 12 7" opacity="0.22"/>

  <!-- portal interior -->
  <circle cx="64" cy="64" r="35.5" fill="url(#portalCore)"/>

  <!-- shimmer swirls -->
  <g fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <path d="M42 80 A 27 27 0 0 1 86 48" stroke="#8f7bff" stroke-width="5" opacity="0.5"/>
    <path d="M86 48 A 27 27 0 0 1 62 90" stroke="#5ec8ff" stroke-width="3.5" opacity="0.35"/>
    <path d="M50 44 A 22 22 0 0 1 78 74" stroke="#c9b8ff" stroke-width="2.5" opacity="0.3"/>
  </g>

  <!-- glowing runes on the ring -->
  <g fill="#ffb340" filter="url(#runeGlow)">
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(108 64) rotate(90)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(102.1 86) rotate(120)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(86 102.1) rotate(150)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(64 108) rotate(180)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(42 102.1) rotate(210)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(25.9 86) rotate(240)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(20 64) rotate(270)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(25.9 42) rotate(300)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(42 25.9) rotate(330)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(64 20)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(86 25.9) rotate(30)"/>
    <rect x="-2.6" y="-5.6" width="5.2" height="11.2" rx="2.6" transform="translate(102.1 42) rotate(60)"/>
  </g>
</svg>
